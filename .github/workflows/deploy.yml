# CI/CD for Scordle.
# - On every push and pull request: install, test, typecheck and build.
# - On pushes to main only (e.g. after merging a PR): publish the built site
#   to GitHub Pages at https://yahliarbel1.github.io/scordle/
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# Least privilege: by default the workflow may only read the code.
permissions:
  contents: read

# If two deploys start close together, finish the running one and
# let only the newest waiting one follow.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install packages (exactly as in package-lock.json)
        run: npm ci

      - name: Run the unit tests
        run: npm test

      - name: Typecheck and build the site into dist/
        run: npm run build

      - name: Hand dist/ over to the deploy job
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build # runs only if build succeeded
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write # allowed to publish to Pages
      id-token: write # proves to Pages that this run really comes from this repo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
